# Python package
# Create and test a Python package on multiple Python versions.
# Add steps that analyze code, save the dist with the build record, publish to a PyPI-compatible index, and more:
# https://docs.microsoft.com/azure/devops/pipelines/languages/python

parameters:
  # defaults for any parameters that are not specified
  name: ''
  vmImage: ''
  use.numba: 'true'


jobs:

- job: ${{ parameters.name }}Test
  pool:
    vmImage: ${{ parameters.vmImage }}
  strategy:
    # The newest Python with the newest packages, and the oldest Python with numpy 1.x
    # (the default integer is 32 bits on Windows) and pandas 2.1. PACKAGES is installed
    # in a single pip command with requirements.txt, so that pip also picks versions
    # of the other packages that work with the pins.
    matrix:
      python314_win_latest:
        python.version: '3.14'
      python310_win_numpy126:
        python.version: '3.10'
        PACKAGES: 'numpy==1.26.4 scipy==1.11.4 pandas==2.1.4 statsmodels==0.14.1 matplotlib seaborn numba'
    maxParallel: 10

  steps:
  - task: UsePythonVersion@0
    inputs:
      versionSpec: '$(python.version)'
      architecture: 'x64'
    displayName: 'Use Python $(python.version)'

  - script: |
      python -m venv arch-test
      call arch-test\Scripts\activate.bat
      python -m pip install --upgrade pip wheel
      python -m pip install -r requirements-dev.txt -U
      python -m pip install %PACKAGES% -r requirements.txt -U || exit /b 1
      python -m pip list
    displayName: 'Create Venv and Install dependencies'

  - script: |
      call arch-test\Scripts\activate.bat
      python -m pip install -e . -vv --no-build-isolation
    displayName: 'Build Cython Extensions'

  - script: |
      call arch-test\Scripts\activate.bat
      pytest arch --junitxml=junit/test-results.xml -n 2 --durations=25
    displayName: 'pytest'

  - task: PublishTestResults@2
    inputs:
      testResultsFiles: '**/test-results.xml'
      testRunTitle: 'Python $(python.version)'
    condition: succeededOrFailed()
