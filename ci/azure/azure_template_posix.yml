# Python package
# Create and test a Python package on multiple Python versions.
# Add steps that analyze code, save the dist with the build record, publish to a PyPI-compatible index, and more:
# https://docs.microsoft.com/azure/devops/pipelines/languages/python

parameters:
  # defaults for any parameters that are not specified
  name: ''
  vmImage: ''
  BUILD_FLAGS: ''


jobs:

- job: ${{ parameters.name }}Test
  pool:
    vmImage: ${{ parameters.vmImage }}
  strategy:
    # Python 3.15, the newest release, runs all of the tests, including the slow ones,
    # with the newest versions of everything. Python 3.14 has the most jobs: without the
    # Cython extensions, with statsmodels main and with nightly builds. The jobs with
    # older Python versions have exact versions of numpy, scipy, pandas, statsmodels and
    # matplotlib, from the oldest that arch supports (3.10) to the last releases before
    # the newest (3.13). Together with the newest versions in the 3.14 and 3.15 jobs
    # they cover numpy 1.x and 2.x, pandas 1.x, 2.x and 3.x, and both sides of the
    # pandas 2.2 and matplotlib 3.10 checks in arch/compat and arch/univariate. The
    # sdist and the wheel are built with the newest numpy and tested with an older one.
    #
    # Variables of an entry
    #   python.version   Version of Python.
    #   NUMPY, SCIPY, PANDAS, STATSMODELS, MATPLOTLIB, NUMBA
    #                    Exact versions. Everything is installed in one command so
    #                    that the installer also picks versions of seaborn, ... that
    #                    work with them.
    #   USE_NUMBA        Install numba, which runs the recursions when the Cython
    #                    extensions are not built
    #   use.conda        Install Miniforge and use mamba and conda-forge instead of
    #                    pip
    #   PYTEST_PATTERN   (slow or not slow) also runs the slow tests, which include
    #                    the example notebooks
    #   test.sdist, test.wheel
    #                    Build and install the package in site-packages and test it
    #   BUILD_FLAGS      Options for building the Cython extensions
    #   cython.coverage  Create the C files that coverage uses to report on the Cython
    #                    code and run a few tests. This only works up to Python 3.12
    #                    and with COVERAGE_CORE=ctrace.
    #   NO_MATPLOTLIB    Do not install matplotlib or seaborn, and fail if they are
    #                    installed anyway
    #   STATSMODELS_MAIN Install statsmodels from its main branch
    #   nightly          Install nightly builds of numpy, scipy, pandas, ...
    #   experimental     Do not fail when the tests fail and do not collect coverage
    matrix:
      # The newest versions of everything
      python_315:
        python.version: '3.15'
        PYTEST_PATTERN: "(slow or not slow)"
      # Without the Cython extensions, so numba runs the recursions
      python_314_no_binary:
        python.version: '3.14'
        BUILD_FLAGS: '-Csetup-args=-Dno-binary=true'
        PYTEST_PATTERN: "(slow or not slow)"
        USE_NUMBA: true
      python_314_statsmodels_main:
        python.version: '3.14'
        STATSMODELS_MAIN: true
      # pandas 2.3, the last 2.x, with copy-on-write, which pandas 3 always uses.
      # The wheel is built with the newest numpy 2 headers.
      python_313_copy_on_write_wheel:
        python.version: '3.13'
        NUMPY: 2.2.6
        SCIPY: 1.15.3
        PANDAS: 2.3.3
        STATSMODELS: 0.14.5
        ARCH_TEST_COPY_ON_WRITE: 1
        test.wheel: true
      # Without matplotlib and seaborn, testing the installed wheel from outside of the
      # source tree, as the arch-wheels builds do. The tests that need matplotlib must
      # skip without it; a test module that imports it unconditionally fails to collect.
      python_313_no_matplotlib_wheel:
        python.version: '3.13'
        NO_MATPLOTLIB: 'true'
        test.wheel: true
      # Coverage of the Cython code, from the tests of the extensions. Coverage only
      # reports Cython lines with its ctrace core, which does not work after Python
      # 3.12. Tracing every line is slow, so the tests that fit models (test_mean.py
      # and test_arch_in_mean.py), which take more than an hour in one process, are
      # not run.
      python_312_cython_coverage:
        python.version: '3.12'
        BUILD_FLAGS: '-Csetup-args=-Dcython-coverage=true'
        cython.coverage: true
        COVERAGE_CORE: ctrace
      # numpy 2.0, the first 2.x, with numba from conda-forge
      python_312_conda_numba:
        python.version: '3.12'
        use.conda: 'true'
        NUMPY: 2.0.2
        USE_NUMBA: true
        PYTEST_PATTERN: "(slow or not slow)"
      # pandas 1.5, the last 1.x, with versions of the other packages from 2023. The
      # sdist is built with the newest numpy 2 headers.
      python_311_sdist:
        python.version: '3.11'
        NUMPY: 1.24.4
        SCIPY: 1.10.1
        PANDAS: 1.5.3
        STATSMODELS: 0.14.0
        MATPLOTLIB: 3.7.5
        test.sdist: true
      # The oldest versions that arch supports. statsmodels 0.13.1 is the oldest
      # with a wheel for Python 3.10, and matplotlib 3.5.0 the oldest with one for
      # Python 3.10. numba is not installed.
      python_310_minimums:
        python.version: '3.10'
        NUMPY: 1.22.3
        SCIPY: 1.8.0
        PANDAS: 1.4.0
        STATSMODELS: 0.13.1
        MATPLOTLIB: 3.5.0
        PYTEST_PATTERN: "(slow or not slow)"
      python_314_pre:
        python.version: '3.14'
        nightly: true
        experimental: true

    maxParallel: 10

  steps:
  - task: UsePythonVersion@0
    inputs:
      versionSpec: '$(python.version)'
      architecture: 'x64'
      # Needed to download a release candidate
      allowUnstable: true
    displayName: 'Use Python $(python.version)'

  - bash: |
      # Use Miniforge, which only uses conda-forge, rather than the Miniconda on the
      # hosted image, which newer images (Ubuntu 26.04) no longer provide
      curl -fsSL -o miniforge.sh \
        "https://github.com/conda-forge/miniforge/releases/latest/download/Miniforge3-Linux-x86_64.sh"
      bash miniforge.sh -b -p "${HOME}/miniforge3"
      rm miniforge.sh
      "${HOME}/miniforge3/bin/mamba" --version
      echo "##vso[task.prependpath]${HOME}/miniforge3/bin"
      echo "##vso[task.prependpath]${HOME}/miniforge3/envs/arch-test/bin"
    displayName: 'Install Miniforge and add it and the env to PATH'
    condition: eq(variables['use.conda'], 'true')

  - script: |
      source ci/azure/install-posix.sh
    displayName: 'Install dependencies'

  - script: |
      if [[ ${STATSMODELS_MAIN} == "true" ]]; then
        echo "Installing statsmodels main"
        source ci/install-statsmodels-main.sh
      fi
    displayName: 'Install arch main'

  - script: |
      echo "Installing to site packages (sdist)"
      python -m pip install pip build --upgrade
      python -m build --sdist . -v  
      SDIST=$(ls -t ./dist/arch-*.tar.gz | head -1)
      pip install ${SDIST} -v
    displayName: 'Install arch (site-packages, sdist)'
    condition: eq(variables['test.sdist'], 'true')

  - script: |
      echo "Installing to site packages (wheel)
      python -m pip install pip wheel --upgrade"
      python -m pip wheel . --no-deps --wheel-dir ./dist/
      WHL=$(ls -t ./dist/arch-*.whl | head -1)
      pip install ${WHL} -v
    displayName: 'Install arch (site-packages, wheel)'
    condition: eq(variables['test.wheel'], 'true')

  - script: |
      echo python -m pip install --no-build-isolation -vv -e . ${BUILD_FLAGS}
      python -m pip install --no-build-isolation -vv -e . ${BUILD_FLAGS}
    displayName: 'Install arch (editable)'
    condition: and(ne(variables['test.wheel'], 'true'), ne(variables['test.sdist'], 'true'))

  - script: |
      pushd arch/univariate
      cython --verbose -M --fast-fail -3  -X cpow=True -X boundscheck=False -X wraparound=False -X cdivision=True -X binding=True -X linetrace=True recursions.pyx
      popd
      pushd arch/bootstrap/
      cython --verbose -M --fast-fail -3  -X cpow=True -X boundscheck=False -X wraparound=False -X cdivision=True -X binding=True -X linetrace=True _samplers.pyx
      popd
    displayName: 'Transpile Cython to C for coverage support'
    condition: eq(variables['cython.coverage'], 'true')

  # After arch is installed so that these show what is tested
  - script: python -m pip list
    displayName: 'List Configuration (PyPI)'
    condition: ne(variables['use.conda'], 'true')

  - script: mamba list -n arch-test
    displayName: 'List Configuration (conda)'
    condition: eq(variables['use.conda'], 'true')

  - script: |
      echo "Testing site packages"
      mkdir test_run_dir
      pushd test_run_dir
      python -c "import arch; arch.test(['-n', 'auto', '--junitxml=../junit/test-results.xml'])"
      popd
    displayName: 'Run tests (site-packages)'
    condition: or(eq(variables['test.wheel'], 'true'), eq(variables['test.sdist'], 'true'))

  - script: |
      echo "Testing editable install"
      export COVERAGE_OPTS="--cov-config=.coveragerc --cov=arch --cov-branch --cov-report xml:coverage.xml --cov-report term"
      echo pytest -m "${PYTEST_PATTERN}" --junitxml=junit/test-results.xml -n auto --durations=25 ${COVERAGE_OPTS} arch/tests
      pytest -m "${PYTEST_PATTERN}" --junitxml=junit/test-results.xml -n auto --durations=25 ${COVERAGE_OPTS} arch/tests
    displayName: 'Run tests (editable)'
    condition: and(and(and(ne(variables['test.wheel'], 'true'), ne(variables['test.sdist'], 'true')), ne(variables['experimental'], 'true')), ne(variables['cython.coverage'], 'true'))

  - script: |
      echo "Testing experimental configuration"
      echo pytest -m "${PYTEST_PATTERN}" --junitxml=junit/test-results.xml -n auto --durations=25 arch/tests
      pytest -m "${PYTEST_PATTERN}" --junitxml=junit/test-results.xml -n auto --durations=25 arch/tests
    displayName: 'Run tests (experimental)'
    condition: eq(variables['experimental'], 'true')
    continueOnError: true

  - script: |
      echo "Testing with Cython coverage"
      # Uninstall xdist to avoid issues with coverage and Cython
      python -m pip uninstall pytest-xdist -y || true
      export COVERAGE_OPTS="--cov-config=.coveragerc --cov=arch --cov-branch --cov-report xml:coverage.xml --cov-report term"
      echo pytest --junitxml=junit/test-results.xml --durations=25 ${COVERAGE_OPTS} arch/tests/univariate/test_recursions.py arch/tests/bootstrap/test_samplers.py arch/tests/univariate/test_arch_in_mean.py
      pytest --junitxml=junit/test-results.xml --durations=25 ${COVERAGE_OPTS} arch/tests/univariate/test_recursions.py arch/tests/bootstrap/test_samplers.py arch/tests/univariate/test_arch_in_mean.py
    displayName: 'Run tests (cython coverage)'
    condition: eq(variables['cython.coverage'], 'true')

  - task: PublishTestResults@2
    inputs:
      testResultsFiles: '**/test-results.xml'
      testRunTitle: 'Python $(python.version)'
    condition: succeededOrFailed()

  - task: PublishCodeCoverageResults@2
    inputs:
      summaryFileLocation: '$(System.DefaultWorkingDirectory)/**/coverage.xml'
    condition: and(ne(variables['test.sdist'], 'true'), ne(variables['test.wheel'], 'true'), ne(variables['experimental'], 'true'))

  - script: |
      curl -Os https://uploader.codecov.io/latest/linux/codecov
      chmod +x codecov
      ./codecov -f coverage.xml -F adder -F subtractor
    displayName: 'Codecov upload'
    condition: and(ne(variables['test.sdist'], 'true'), ne(variables['test.wheel'], 'true'), ne(variables['experimental'], 'true'))
