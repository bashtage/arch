name: Windows ARM

# Builds the wheel on Windows on ARM (ARM64) and runs the whole test suite on the
# installed package. numpy, scipy, pandas, statsmodels, matplotlib and numba have
# win_arm64 wheels, so arch is the only package that is compiled.
#
# The number of BLAS threads is not limited, unlike the other CI. With
# OPENBLAS_NUM_THREADS=1, numpy.linalg.inv and solve crash (access violation) for 23x23
# to 31x31 matrices in the OpenBLAS of every numpy win_arm64 wheel (numpy#29442; see
# #1003 to #1007), and with 2 threads they hang.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# A new push to a pull request cancels the run of the one before
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Windows ARM64, Python ${{ matrix.python-version }}
    runs-on: windows-11-arm
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        # statsmodels has win_arm64 wheels from Python 3.13
        python-version: ["3.13", "3.14"]
        numba: [true]
        include:
          # numba has no win_arm64 wheels for Python 3.15, so its code is tested
          # without it
          - python-version: "3.15"
            numba: false
    env:
      # The same hash seed in every pytest-xdist worker, so that they collect the same
      # tests
      PYTHONHASHSEED: 12345678
      MPLBACKEND: agg

    steps:
      - uses: actions/checkout@v7
        with:
          # setuptools_scm reads the version from the tags
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          architecture: arm64
          allow-prereleases: true

      # Fail rather than test an x64 Python that runs under emulation
      - name: Check that Python is ARM64
        run: |
          python -c "import platform, sys; print(sys.version, platform.machine())"
          python -c "import sys, sysconfig; print(sysconfig.get_platform()); sys.exit(sysconfig.get_platform() != 'win-arm64')"

      # Only wheels, so that the job fails if a dependency would have to be compiled. The
      # test requirements are the test dependency group in pyproject.toml.
      - name: Install the dependencies
        env:
          NUMBA: ${{ matrix.numba }}
        run: |
          packages=(numpy scipy pandas statsmodels matplotlib seaborn)
          if [[ "${NUMBA}" == "true" ]]; then
            packages+=(numba)
          fi
          python -m pip install --upgrade pip
          python -m pip install --only-binary=:all: --group test "${packages[@]}"

      - name: Build the wheel
        run: |
          python -m pip wheel . --no-deps --wheel-dir dist -v
          ls dist

      - name: Install the wheel
        id: install-arch
        run: python -m pip install dist/arch-*-win_arm64.whl

      # After arch is installed so that this shows what is tested
      - name: List the packages
        run: python -m pip list

      - name: Show the system and the BLAS
        run: |
          echo "Runner image: ${ImageOS} ${ImageVersion}"
          powershell -NoProfile -Command "Get-CimInstance Win32_Processor | Format-List Name, Manufacturer, NumberOfCores, NumberOfLogicalProcessors"
          python -c "import numpy; numpy.show_config()"
          python -c "import scipy; scipy.show_config()"

      # threadpoolctl does not find this OpenBLAS, so ask it directly
      - name: Check that the BLAS threads are not limited
        run: |
          for var in OPENBLAS_NUM_THREADS GOTO_NUM_THREADS OMP_NUM_THREADS MKL_NUM_THREADS NUMEXPR_NUM_THREADS VML_NUM_THREADS; do
            if [[ -n "${!var:-}" ]]; then
              echo "${var} is set to ${!var}"
              exit 1
            fi
          done
          python - <<'EOF'
          import ctypes
          import glob
          import os

          import numpy

          site = os.path.dirname(os.path.dirname(numpy.__file__))
          path = glob.glob(os.path.join(site, "numpy.libs", "*openblas*.dll"))[0]
          lib = ctypes.CDLL(path)
          names = ["scipy_openblas_get_num_threads64_", "scipy_openblas_get_num_threads"]
          name = next(n for n in names if hasattr(lib, n))
          threads = getattr(lib, name)()
          print(f"{os.path.basename(path)}: {threads} threads")
          raise SystemExit(threads < 2)
          EOF

      # arch falls back to the pure Python code when an extension cannot be imported, so
      # import them directly. Outside of the source tree, so that the installed package
      # is imported.
      - name: Check that the compiled extensions load
        working-directory: ${{ runner.temp }}
        run: |
          python -c "from arch.univariate import recursions; print(recursions.__file__)"
          python -c "from arch.bootstrap import _samplers; print(_samplers.__file__)"

      # The tests that the other CI runs
      - name: Run the tests
        working-directory: ${{ runner.temp }}
        run: python -X faulthandler -c "import arch; arch.test(['-n', 'auto', '-m', 'not slow', '--durations=25'])"

      # And the rest of the suite, whether or not the tests pass
      - name: Run the slow tests
        if: ${{ !cancelled() && steps.install-arch.outcome == 'success' }}
        working-directory: ${{ runner.temp }}
        run: python -X faulthandler -c "import arch; arch.test(['-n', 'auto', '-m', 'slow', '--durations=25'])"
