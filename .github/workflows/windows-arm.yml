name: Windows ARM

# Builds the wheel on Windows on ARM (ARM64) and tests the installed package. numpy,
# scipy, pandas, statsmodels, matplotlib and numba all have win_arm64 wheels, so arch
# is the only package that is compiled.
#
# The first run crashed (access violation) in numpy.linalg.inv and solve, in the
# OpenBLAS of numpy's win_arm64 wheel, in the unit root tests. Until that is isolated,
# only the univariate and the multiple comparison tests run, in a single process with
# the name of each test, and the tests that crashed are run on their own to find the
# matrices that crash and whether numpy alone crashes on them.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Windows ARM64, Python ${{ matrix.python-version }}
    runs-on: windows-11-arm
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]
    env:
      MKL_NUM_THREADS: 1
      OMP_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
      PYTHONHASHSEED: 12345678
      MPLBACKEND: agg

    steps:
      - uses: actions/checkout@v7
        with:
          # setuptools_scm reads the version from the tags
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          architecture: arm64

      # Fail rather than test an x64 Python that runs under emulation
      - name: Check that Python is ARM64
        run: |
          python -c "import platform, sys; print(sys.version, platform.machine())"
          python -c "import sys, sysconfig; print(sysconfig.get_platform()); sys.exit(sysconfig.get_platform() != 'win-arm64')"

      # Only wheels, so that the job fails if a dependency would have to be compiled
      - name: Install the dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --only-binary=:all: numpy scipy pandas statsmodels matplotlib seaborn numba "pytest>=9,<10" threadpoolctl

      - name: Build the wheel
        run: |
          python -m pip wheel . --no-deps --wheel-dir dist -v
          ls dist

      - name: Install the wheel
        run: python -m pip install dist/arch-*-win_arm64.whl

      # After arch is installed so that this shows what is tested
      - name: List the packages
        run: python -m pip list

      # The BLAS that numpy was built with and the one, and the kernels, it loads
      - name: Show the BLAS
        run: |
          python -c "import numpy; numpy.show_config()"
          python -m threadpoolctl -i numpy

      # arch falls back to the pure Python code when an extension cannot be imported, so
      # import them directly. Outside of the source tree, so that the installed package
      # is imported.
      - name: Check that the compiled extensions load
        id: extensions
        working-directory: ${{ runner.temp }}
        run: |
          python -c "from arch.univariate import recursions; print(recursions.__file__)"
          python -c "from arch.bootstrap import _samplers; print(_samplers.__file__)"

      # One process, with the name of each test shown before it runs, so that a crash
      # names the test
      - name: Run the univariate tests
        working-directory: ${{ runner.temp }}
        run: python -X faulthandler -c "import arch; arch.test(['-v', '-m', 'not slow', '--durations=25'], location='tests/univariate')"

      # Only when the univariate tests pass
      - name: Run the multiple comparison tests
        working-directory: ${{ runner.temp }}
        run: python -X faulthandler -c "import arch; arch.test(['-v', '-m', 'not slow', '-k', 'multiple_comparison', '--durations=25'], location='tests/bootstrap')"

      # Runs whether or not the tests pass. The results are in the log and the job
      # summary, and the matrices that crashed are uploaded.
      - name: Isolate the crashes in numpy.linalg
        if: ${{ !cancelled() && steps.extensions.outcome == 'success' }}
        continue-on-error: true
        working-directory: ${{ runner.temp }}
        run: python "${GITHUB_WORKSPACE}/ci/github-actions/windows_arm_linalg.py" linalg-crashes

      - name: Upload the matrices that crashed
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: windows-arm-linalg-crashes
          path: ${{ runner.temp }}/linalg-crashes
          if-no-files-found: ignore
